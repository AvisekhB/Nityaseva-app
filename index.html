<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nityaseva - Family Secure Access</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <div class="logo">
      <span>🌸</span>
      <h1>Nityaseva</h1>
    </div>
    <p class="subtitle">Eternal service, Timeless care.</p>

    <h2>Family secure access</h2>
    <p class="desc">Enter your registered email address to receive a secure one-time password.</p>

    <!-- Status / Error Messages -->
    <div id="message" class="message"></div>

    <!-- Email Section -->
    <div class="form-group">
      <label for="email">Registered email</label>
      <input type="email" id="email" placeholder="avisekhrock@gmail.com" autocomplete="email">
      <button id="sendOtpBtn">Send OTP</button>
    </div>

    <!-- OTP Section (Hidden initially) -->
    <div id="otpSection" style="display: none;" class="form-group">
      <label for="otp">Enter OTP</label>
      <input type="text" id="otp" placeholder="6-digit OTP" maxlength="6" inputmode="numeric">
      <div id="timer" class="timer"></div>
      <button id="verifyOtpBtn">Verify OTP</button>
    </div>
  </div>

  <!-- Load Config FIRST, then App -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
