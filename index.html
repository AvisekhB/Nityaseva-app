<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Nityaseva Family Secure Access</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    #f3f8f6;

  color:
    #173f38;
}


.card {

  width:
    min(430px, 92%);

  background:
    white;

  padding:
    30px;

  border-radius:
    18px;

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.08);
}


.logo {

  font-size:
    28px;

  font-weight:
    700;

  margin-bottom:
    4px;
}


.tagline {

  font-size:
    13px;

  color:
    #71827e;

  margin-bottom:
    35px;
}


h1 {

  font-size:
    24px;

  margin-bottom:
    10px;
}


.subtitle {

  color:
    #6b7c78;

  line-height:
    1.5;

  margin-bottom:
    25px;
}


label {

  display:
    block;

  font-weight:
    600;

  margin-bottom:
    8px;
}


input {

  width:
    100%;

  padding:
    14px;

  border:
    1px solid #d8e2df;

  border-radius:
    10px;

  font-size:
    15px;

  margin-bottom:
    15px;
}


input:focus {

  outline:
    none;

  border-color:
    #2e806e;
}


button {

  width:
    100%;

  border:
    none;

  border-radius:
    10px;

  padding:
    14px;

  font-size:
    15px;

  font-weight:
    700;

  cursor:
    pointer;

  background:
    #2e806e;

  color:
    white;

  margin-bottom:
    12px;
}


button:disabled {

  opacity:
    .6;

  cursor:
    wait;
}


#otpSection {

  display:
    none;

  margin-top:
    20px;
}


.message {

  padding:
    13px;

  border-radius:
    10px;

  margin-top:
    12px;

  font-size:
    14px;
}


.message.error {

  background:
    #fff0f0;

  color:
    #c0392b;
}


.message.success {

  background:
    #eaf8f2;

  color:
    #20745e;
}


.timer {

  text-align:
    center;

  font-size:
    13px;

  color:
    #71827e;

  margin:
    4px 0 15px;
}

</style>

</head>


<body>


<div class="card">


  <div class="logo">
    🌸 Nityaseva
  </div>


  <div class="tagline">
    Eternal service, Timeless care.
  </div>


  <h1>
    Family secure access
  </h1>


  <div class="subtitle">
    Enter your registered email address
    to receive a secure one-time password.
  </div>


  <label for="email">
    Registered email
  </label>


  <input
    id="email"
    type="email"
    placeholder="Enter registered email"
    autocomplete="email"
  >


  <button id="sendOtpBtn">
    Send OTP
  </button>


  <div id="otpSection">


    <label for="otp">
      Enter OTP
    </label>


    <input
      id="otp"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="6-digit OTP"
      autocomplete="one-time-code"
    >


    <div
      id="timer"
      class="timer"
    >
      OTP valid for 10:00
    </div>


    <button id="verifyOtpBtn">
      Verify OTP
    </button>


  </div>


  <div
    id="message"
    class="message"
  ></div>


</div>


<script src="config.js"></script>

<script src="app.js"></script>


</body>

</html>
