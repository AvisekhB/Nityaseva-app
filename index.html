<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nityaseva — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2>Nityaseva Care</h2>
      <p style="font-size: 13px; color: #718096; margin-bottom: 20px;">Senior Care Coordination Platform</p>

      <div id="step-email">
        <div class="form-group">
          <label for="email">Registered Email Address</label>
          <input type="email" id="email" placeholder="name@example.com" required>
        </div>
        <button id="btn-send-otp" style="width: 100%;">Send Login Code</button>
      </div>

      <div id="step-otp" class="hidden">
        <div class="form-group">
          <label for="otp">Enter 6-Digit OTP</label>
          <input type="text" id="otp" placeholder="123456" maxlength="8">
        </div>
        <button id="btn-verify-otp" style="width: 100%;">Verify & Sign In</button>
        <button id="btn-back" class="secondary" style="width: 100%; margin-top: 8px;">Back</button>
      </div>

      <div id="msg" class="message hidden"></div>
    </div>
  </div>

  <script type="module">
    import { sendOtp, verifyOtp, getCurrentUserProfile } from './js/auth.js';

    const stepEmail = document.getElementById('step-email');
    const stepOtp = document.getElementById('step-otp');
    const emailInput = document.getElementById('email');
    const otpInput = document.getElementById('otp');
    const msg = document.getElementById('msg');

    function showMsg(text, isError = false) {
      msg.textContent = text;
      msg.className = 'message ' + (isError ? 'error' : 'success');
      msg.classList.remove('hidden');
    }

    document.getElementById('btn-send-otp').addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) return showMsg('Please enter an email address', true);

      try {
        showMsg('Sending login code...');
        await sendOtp(email);
        stepEmail.classList.add('hidden');
        stepOtp.classList.remove('hidden');
        showMsg('Login code sent to ' + email);
      } catch (err) {
        showMsg(err.message, true);
      }
    });

    document.getElementById('btn-verify-otp').addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const code = otpInput.value.trim();
      if (!code) return showMsg('Please enter your 6-digit code', true);

      try {
        showMsg('Verifying code...');
        await verifyOtp(email, code);
        const profile = await getCurrentUserProfile();
        const role = profile && profile.role ? profile.role : 'family';
        window.location.href = role + '.html';
      } catch (err) {
        showMsg(err.message, true);
      }
    });

    document.getElementById('btn-back').addEventListener('click', () => {
      stepOtp.classList.add('hidden');
      stepEmail.classList.remove('hidden');
      msg.classList.add('hidden');
    });
  </script>
</body>
</html>
